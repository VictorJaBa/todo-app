<!-- div.card (flex, items-centerm, gap-4)-->
<div class="bg-gray-800 rounded-xl p-4 mb-3 flex items-center gap-4" [class.opacity-60]="task.completed">
  <input type="checkbox" class="w-5 h-5 accent-violet-600" [checked]="task.completed" (change)="toggle()">

  <!-- div.content -->
  <div class="flex-1">
    <!-- If task.completed its true, will apply the line-throught style -->
    <h3 class="font-medium" [class.line-through]="task.completed" [class.text-gray-500]="task.completed"
      [class.text-white]="!task.completed">
      {{ task.title }}
    </h3>
    <p class="text-gray-400 text-sm">{{ task.description }}</p>
  </div>
  <!-- trash icon from fontawesome -->
  <button class="text-gray-400 hover:text-red-500 transition-colors cursor-pointer" (click)="delete()">
    <i class="fa-solid fa-trash text-xl"></i>
  </button>
</div>
