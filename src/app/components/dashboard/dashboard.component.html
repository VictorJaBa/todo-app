<div class="flex h-screen bg-gray-950 text-white">
    <!--Sidebar-->
    <aside class="w-64 bg-gray-900 border-r border-gray-700 flex flex-col p-6">
        <!--Logo-->
        <div class="flex items-center gap-2 text-3xl font-bold mb-8">
            <span class="bg-violet-700 p-3 rounded"></span>
            <span>ToDo App</span>
        </div>
        <!--Filters-->
        <div class="">
            <form class="flex items-center">
                <label for="search" class="sr-only">Task Search</label>
                <input type="text" id="Search"
                    class="bg-gray-900 border border-gray-700 w-full rounded text-gray-900 text-sm"
                    placeholder="Search task...">
                <button type="submit"
                    class="inline-flex items-center py-2.5 px-3 ml-2 text-sm font-medium text-gray-900 bg-gray-600 rounded-lg border border-gray-700 hover:bg-gray-700">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <div>
                <h3 class="text-gray-400 text-xs uppercase mb-3">Filters</h3>
                <app-task-filter />
            </div>

        </div>

        <!--bottom settings menu-->
        <div class="mt-auto mb-4">
            <button (click)="enable2FA()" [disabled]="totpEnabled"
                class="flex items-center gap-2 w-full text-left p-2 rounded transition-colors"
                [class.text-green-400]="totpEnabled" [class.hover:bg-gray-700]="!totpEnabled"
                [class.text-gray-300]="!totpEnabled">
                <i class="fa-solid fa-shield-halved"></i>
                {{ totpEnabled ? '2FA Enabled ✓' : 'Enable 2FA' }}
            </button>

            <button (click)="logout()"
                class="flex items-center gap-2 w-full text-left p-2 rounded hover:bg-gray-700 text-red-400">
                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar Sesión
            </button>
        </div>


    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <app-task-form />
        <app-task-list />
    </main>

    <!-- Modal Setup 2FA -->
    @if (showSetup2FA) {
    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-gray-900 rounded-xl p-8 w-full max-w-md border border-gray-700">

            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-white">Setup 2FA</h2>
                <button (click)="showSetup2FA = false" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <p class="text-gray-400 text-sm mb-6">
                Scan the QR code with Google Authenticator, then enter the 6-digit code.
            </p>

            @if (qrCodeUrl()) {
            <div class="flex justify-center mb-6">
                <img [src]="qrCodeUrl()" alt="QR Code" class="rounded-lg">
            </div>
            }

            @if (errorMessage2FA) {
            <p class="text-red-400 text-sm mb-4 bg-red-400/10 px-3 py-2 rounded-lg">
                {{ errorMessage2FA }}
            </p>
            }

            <div class="mb-4">
                <label class="text-gray-400 text-sm mb-1 block">Verification Code</label>
                <input type="text" [(ngModel)]="verificationCode"
                    class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 w-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
                    placeholder="000000" maxlength="6">
            </div>

            <button (click)="confirmSetup()"
                class="w-full bg-violet-600 hover:bg-violet-700 text-white py-2 rounded-lg font-medium transition-colors">
                Confirm & Enable 2FA
            </button>

        </div>
    </div>
    }
</div>
