<div class="min-h-screen bg-gray-950 flex items-center justify-center">
    <div class="bg-gray-900 rounded-xl p-8 w-full max-w-md border border-gray-700">

        <!-- Logo -->
        <div class="flex items-center gap-2 mb-8">
            <span class="bg-violet-600 p-2 rounded"></span>
            <h1 class="text-2xl font-bold text-white">ToDo App</h1>
        </div>

        <h2 class="text-xl font-semibold text-white mb-6">Create an account</h2>

        <!-- Error message -->
        @if (errorMessage) {
        <p class="text-red-400 text-sm mb-4 bg-red-400/10 px-3 py-2 rounded-lg">
            {{ errorMessage }}
        </p>
        }

        <!-- Email form -->
        <div class="flex flex-col gap-4 mb-6">
            <div>
                <label class="text-gray-400 text-sm mb-1 block">Email</label>
                <input type="email" [(ngModel)]="email"
                    class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 w-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
                    placeholder="you@example.com">
            </div>
            <div>
                <label class="text-gray-400 text-sm mb-1 block">Password</label>
                <input type="password" [(ngModel)]="password"
                    class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 w-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
                    placeholder="••••••••">
            </div>
            <div>
                <label class="text-gray-400 text-sm mb-1 block">Confirm Password</label>
                <input type="password" [(ngModel)]="confirmPassword"
                    class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 w-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
                    placeholder="••••••••">
            </div>
            <button (click)="registerWithEmail()"
                class="bg-violet-600 hover:bg-violet-700 text-white py-2 rounded-lg font-medium transition-colors">
                Register
            </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 h-px bg-gray-700"></div>
            <span class="text-gray-500 text-sm">or</span>
            <div class="flex-1 h-px bg-gray-700"></div>
        </div>

        <!-- Google login -->
        <button (click)="registerWithGoogle()"
            class="w-full flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white py-2 rounded-lg transition-colors">
            <i class="fa-brands fa-google"></i>
            Continue with Google
        </button>

        <!-- Register link -->
        <p class="text-center text-gray-400 text-sm mt-6">
            Already have an account?
            <a routerLink="/login" class="text-violet-400 hover:text-violet-300">Login</a>
        </p>

    </div>
</div>
