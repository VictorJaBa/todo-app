<div class="min-h-screen bg-gray-950 flex itemx-center justify-center">
    <div class="bg-gray-900 rounded-xl p-8 w-full max-w-md border border-gray-700 text-white">
        <div class="flex items-center gap-2 mb-6">
            <span class="bg-violet-600 p-2 rounded"></span>
            <h1 class="text-2xl font-bold text-white">ToDo App</h1>
        </div>

        <h2 class="text-xl font-semibold text-white mb-2">Setup Two-Factor Authentication</h2>
        <p class="text-gray-400 text-sm mb-6">
            Scan the QR code with Google Authenticator, then enter the 6-digit code to confirm.
        </p>

        <!--QR code is display here-->
        @if(qrCodeUrl()) {
        <div class="flex justify-center mb-6">
            <img [src]="qrCodeUrl()" alt="QR Code" class="rounded-lg">
        </div>
        }

        <!--Verification-->
        @if (errorMessage) {
        <p class="text-red-400 text-sm mb-4 bg-red-400/10 px-3 py-2 rounded-lg">
            {{ errorMessage }}
        </p>
        }

        <div class="mb-4">
            <label class="text-gray-400 text-sm mb-1 block">Verification Code</label>
            <input type="text" [(ngModel)]="verificationCode"
                class="bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 w-full text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-500"
                placeholder="000000" maxlength="6">
        </div>

        <button (click)="confirmSetup()"
            class="w-full bg-violet-600 hover:bg-violet-700 text-white py-2 rounded-lg font-medium transition-colors">
            Confirm and enable 2FA
        </button>
    </div>
</div>
