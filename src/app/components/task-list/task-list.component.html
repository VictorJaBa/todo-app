<!-- div.container -->
<div>

  <!-- div.header -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-white">My Tasks</h2>
    <!-- span with counter of pending tasks -->
    <span class="bg-violet-600 text-white text-sm px-2 py-2 rounded-full">{{ pendingTask().length }}</span>
  </div>

  <!-- div.row -->
  <div>
    @for (task of tasks(); track task.id){
    <app-task-item [task]="task" />
    } @empty {
    <!-- It shows when the array its empty -->
    <div class="flex flex-col items-center gap-2 text-center text-gray-500 py-12">
      <i class="fa-regular fa-clipboard text-4xl mb-3 block"></i>
      <p>No tasks yet...</p>
    </div>
    }
  </div>
</div>
